    Research Profile:
      - bullet: Incoming M.S. student in Computer Science at NYU Courant (Fall 2026).
      - bullet: Interested in robot learning, manipulation, imitation learning, calibration/perception, real-world deployment, and human-in-the-loop correction.

    Education:
      - institution: New York University, Courant Institute of Mathematical Sciences
        location: New York, NY
        degree: M.S.
        area: Computer Science
        highlights:
          - Incoming student, Fall 2026.

      - institution: Sejong University
        location: Seoul, South Korea
        degree: Undergraduate Study
        area: Computer Science
        highlights:
          - Robotics / computer vision research internship experience.

    Experience:
      - company: Robotics and Computer Vision Lab, Sejong University
        position: Research Intern
        location: Seoul, South Korea
        start_date: "2026-01"
        end_date: "2026-04"
        highlights:
          - Worked across real robot manipulation pipelines, including teleoperation, dataset collection, training, deployment, and evaluation.
          - Adapted calibration and robot-learning tooling to Piper and SO-101 hardware.
          - Debugged camera calibration, policy deployment behavior, action latency, and hardware/software integration issues.
          - Analyzed policy failures under camera changes, wrist-camera occlusion, OOD object placement, and grasp instability.

    Selected Projects:
      - name: Real Robot Imitation Learning Pipeline
        highlights:
          - Collected SO-101 demonstrations, fine-tuned a smolVLA model, and evaluated deployment under camera and object-placement changes.

      - name: Diffusion Policy Deployment and Failure Analysis
        highlights:
          - Collected 100 pick-and-place episodes, deployed a trained checkpoint, and analyzed action-chunk latency and representation issues.

      - name: Calibration and Cross-View Alignment
        highlights:
          - Adapted RAIDEN calibration tooling to Piper and validated wrist/scene camera transforms with Open3D.

      - name: Human-in-the-Loop Policy Correction
        highlights:
          - Implemented joint-space delta intervention for corrective control during policy execution.

    Technical Skills:
      - label: Robot Learning
        details: imitation learning, diffusion policy pipelines, smolVLA / VLA models, deployment evaluation
      - label: Robot Systems
        details: Piper arm, SO-101 arm, leader-follower teleoperation, Jetson, CAN, RealSense
      - label: Calibration / Perception
        details: hand-eye calibration, camera extrinsics, ChArUco, Open3D, multi-view alignment
      - label: Tools
        details: Python, PyTorch, LeRobot, Hugging Face Hub, wandb, Linux
